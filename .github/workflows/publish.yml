name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # PyPI Trusted Publishers (OIDC) — no API token needed once the
    # publisher is configured at https://pypi.org/manage/account/publishing/
    # Until then, fall back to PYPI_API_TOKEN secret via twine.
    permissions:
      id-token: write   # required for OIDC
      contents: read
    environment: pypi   # required by PyPI Trusted Publishers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install build + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
      - name: Run tests
        run: python -m pytest -ra
      - name: Build wheel + sdist
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
