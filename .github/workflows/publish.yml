name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # API-token path. We started on Trusted Publishers (OIDC) but that
    # requires 2FA on the PyPI account before the publishing config
    # page is even accessible, so for the initial v0.1.0 publish we
    # use a PYPI_API_TOKEN secret. After the project exists on PyPI we
    # can configure Trusted Publishers for the project (still useful —
    # short-lived OIDC tokens are strictly better than a long-lived
    # API token), but that migration is non-blocking.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install build + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
      - name: Run tests
        run: python -m pytest -ra
      - name: Build wheel + sdist
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
