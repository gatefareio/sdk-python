name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # PyPI Trusted Publishers (OIDC). The gatefare project on PyPI is
    # configured with this repo (gatefareio/sdk-python), this workflow
    # filename (publish.yml), and no environment. GitHub mints a
    # short-lived OIDC token per run; PyPI verifies it against that
    # config. No long-lived API token to store, rotate, or leak.
    #
    # If you ever need to fall back to a token, add:
    #   with:
    #     password: ${{ secrets.PYPI_API_TOKEN }}
    # and grant the token publish scope on the project.
    permissions:
      id-token: write   # required for OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install build + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
      - name: Run tests
        run: python -m pytest -ra
      - name: Build wheel + sdist
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
