name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly live smoke against gatefare.io — catches upstream schema
    # drift before users hit it. Mondays at 09:00 UTC.
    - cron: "0 9 * * 1"

jobs:
  test:
    name: pytest + build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -ra
      - name: Build wheel + sdist
        run: |
          python -m pip install build
          python -m build

  smoke-live:
    name: live smoke vs gatefare.io
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Read-only smoke against gatefare.io
        run: python scripts/smoke_live.py
