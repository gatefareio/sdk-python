[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "gatefare"
version = "0.1.0"
description = "Python client for the Gatefare x402 payment marketplace. Pay any Gatefare-listed API in USDC on Base."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Gatefare", email = "hello@gatefare.io" },
]
keywords = [
    "gatefare",
    "x402",
    "http-402",
    "usdc",
    "base",
    "agent",
    "ai-agent",
    "payment",
    "marketplace",
    "non-custodial",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "eth-account>=0.13,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-httpx>=0.30,<1.0",
    "ruff>=0.6,<1.0",
]

[project.urls]
Homepage    = "https://gatefare.io"
Repository  = "https://github.com/gatefareio/sdk-python"
Issues      = "https://github.com/gatefareio/sdk-python/issues"
Catalog     = "https://gatefare.io/catalog"

[tool.hatch.build.targets.wheel]
packages = ["src/gatefare"]

[tool.hatch.build.targets.sdist]
include = [
    "src/gatefare",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
